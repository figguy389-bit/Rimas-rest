<!DOCTYPE html>
<html lang="ar" dir="rtl" class=""><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مطعم ريماس للوجبات السريعة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&amp;family=Reem+Kufi:wght@600&amp;display=swap" rel="stylesheet">
<style>
:root{--g:#d9b36a;--g2:#f3dca4;--t:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:12px}
body{margin:0;background:#0b0907;color:var(--t);font-family:Tajawal,Tahoma,sans-serif;min-height:100vh}
#bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 20% 15%,rgba(217,179,106,.35),transparent 28%),radial-gradient(circle at 80% 30%,rgba(200,90,40,.3),transparent 25%),radial-gradient(circle at 50% 85%,rgba(217,179,106,.25),transparent 30%),linear-gradient(160deg,#1c130b,#0a0806 60%,#1a0f08);background-size:cover;background-position:center}
#bg.img{filter:blur(4px) brightness(.5);transform:scale(1.05)}
.glass{background:rgba(255,255,255,.09);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid rgba(255,255,255,.2);box-shadow:0 10px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.25)}
#welcome{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.35);transition:.6s}
#welcome.hide{opacity:0;pointer-events:none;transform:scale(1.05)}
.wc{max-width:420px;width:100%;border-radius:32px;padding:28px 22px;text-align:center}
.logo{width:110px;height:110px;border-radius:50%;border:3px solid var(--g);object-fit:cover;box-shadow:0 0 30px rgba(217,179,106,.5)}
h1{font-family:'Reem Kufi',Tajawal;font-size:24px;margin:14px 0 6px;color:var(--g2);line-height:1.5}
.sub{color:#e9e1d2;font-size:15px;line-height:1.9}
.big{display:block;width:100%;margin-top:22px;padding:17px;border-radius:50px;font:800 18px Tajawal;color:#2a1c08;background:linear-gradient(135deg,#f6e2ae,#c9993f);border:0;box-shadow:0 8px 28px rgba(217,179,106,.45);cursor:pointer}
.big.gl{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.4);backdrop-filter:blur(10px)}
header{text-align:center;padding:20px 14px 6px}
header .logo{width:76px;height:76px}
header h2{font-family:'Reem Kufi',Tajawal;margin:8px 0 0;font-size:20px;color:var(--g2)}
.tiles{display:flex;gap:12px;overflow-x:auto;padding:14px;margin:8px 10px;border-radius:24px;scrollbar-width:none}
.tiles::-webkit-scrollbar{display:none}
.tile{flex:0 0 112px;text-align:center;font-size:13px;font-weight:700;cursor:pointer;position:relative}
.tile .im{width:112px;height:112px;border-radius:26px;background-size:cover;background-position:center;border:2px solid rgba(217,179,106,.7);display:flex;align-items:center;justify-content:center;font-size:46px;background-color:#2b1d10;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.tile span{display:block;font-size:15px;margin-top:8px;color:var(--g2)}
main{padding:6px 14px 20px;max-width:760px;margin:auto}
.sec h3{font-family:'Reem Kufi',Tajawal;font-size:22px;color:var(--g2);margin:26px 4px 12px;display:flex;align-items:center;gap:8px}
.sec h3:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--g),transparent)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{position:relative;aspect-ratio:1/1.3;border-radius:24px;overflow:hidden;background:#2b1d10 center/cover;border:1px solid rgba(255,255,255,.18);box-shadow:0 10px 26px rgba(0,0,0,.5)}
.card .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:72px;opacity:.55}
.bar{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:6px;background:rgba(30,20,10,.45);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid rgba(255,255,255,.2)}
.bar b{font-size:14px;line-height:1.35}.bar i{font-style:normal;color:var(--g2);font-weight:800;font-size:14px;white-space:nowrap}
.add{position:absolute;top:10px;left:10px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(250,245,230,.92);font-size:26px;line-height:1;color:#2a1c08;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.add:active{transform:scale(.88)}
footer{text-align:center;padding:10px 16px 110px}
footer h3{font-family:'Reem Kufi',Tajawal;font-size:28px;color:var(--g2);margin:20px 0 14px}
.soc{display:flex;justify-content:center;gap:16px;margin-bottom:16px}
.soc a{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
.soc svg{width:30px;height:30px}
.ph2{display:flex;flex-direction:column;gap:10px;max-width:340px;margin:auto}
.ph2 a{display:flex;align-items:center;justify-content:center;gap:10px;padding:13px;border-radius:50px;color:#fff;text-decoration:none;font-weight:800;font-size:18px;direction:ltr}
.ph2 svg{width:24px;height:24px;fill:#25d366}
#cartb{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:20;padding:14px 26px;border-radius:50px;border:0;font:800 16px Tajawal;color:#2a1c08;background:linear-gradient(135deg,#f6e2ae,#c9993f);box-shadow:0 8px 28px rgba(0,0,0,.6);display:none;cursor:pointer}
.ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:20px;background:rgba(28,20,12,.82)}
.sheet h4{margin:0 0 12px;font-family:'Reem Kufi',Tajawal;font-size:22px;color:var(--g2)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.12)}
.row .n{flex:1;font-weight:700}.q{display:flex;align-items:center;gap:8px}
.q button{width:30px;height:30px;border-radius:50%;border:1px solid var(--g);background:transparent;color:var(--g2);font-size:18px;cursor:pointer}
input,select,textarea{width:100%;margin:6px 0;padding:13px;border-radius:14px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;font:16px Tajawal}
select option{color:#000}
label{font-size:13px;color:#cdbf9f}
.tot{display:flex;justify-content:space-between;font-weight:800;margin:6px 0;color:var(--g2)}
.lock{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:15;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:#fff;opacity:.55;font-size:16px;cursor:pointer}
.eb{position:absolute;top:10px;right:10px;z-index:3;width:36px;height:36px;border-radius:50%;border:0;background:var(--g);color:#000;cursor:pointer}
.tile .eb{top:-6px;right:-4px;width:28px;height:28px;font-size:12px}
.ed .addn{display:block;width:100%;margin:12px 0;padding:12px;border-radius:16px;border:1px dashed var(--g);background:transparent;color:var(--g2);font:700 15px Tajawal;cursor:pointer}
#bar{position:fixed;top:0;left:0;right:0;z-index:30;background:#3a2a10;color:#fff;font-size:13px;padding:8px 14px calc(8px);padding-top:calc(8px + env(safe-area-inset-top,0px));display:none;justify-content:space-between;align-items:center}
.ed #bar{display:flex}.ed body{padding-top:44px}
#bar button{background:var(--g);border:0;border-radius:20px;padding:5px 12px;font:700 12px Tajawal;margin-inline-start:6px}
.pv{width:100%;height:150px;border-radius:16px;background:#2b1d10 center/cover;margin:6px 0}
.eb{display:none}.ed .eb{display:block}
</style></head><body>

<div id="welcome" ${sessionStorage.in?'class="hide"':''}><div class="wc glass"><img class="logo" src="${LOGO}"><h1>أهلاً وسهلاً بك في مطعم ريماس للوجبات السريعة</h1><div class="sub">📍 النجف – حي ميسان – شارع النخيل<br>خلف مدرسة الصدرين<br>🕙 أوقات العمل: ١٠:٠٠ صباحاً حتى ٢:٠٠ فجراً</div><button class="big" onclick="enter()">المتابعة إلى المنيو</button></div></div>
<header><img class="logo" src="${LOGO}"><h2>مطعم ريماس</h2></header>
<div class="tiles glass">${S.cats.map(c=>`<div class="tile" onclick="document.getElementById('${c.id}').scrollIntoView()"><button class="eb" onclick="event.stopPropagation();editCat('${c.id}')">✎</button><div class="im" style="${c.img?`background-image:url(${c.img})`:''}">${c.img?'':c.emoji}</div><span>${esc(c.name)}</span></div>`).join('')}</div>
<main>${S.cats.map(c=>`<section class="sec" id="${c.id}"><h3>${c.emoji} ${esc(c.name)}</h3><div class="grid">${c.items.map(i=>`<div class="card" style="${i.img?`background-image:url(${i.img})`:''}">${i.img?'':`<div class="ph">${c.emoji}</div>`}<button class="eb" onclick="editItem('${c.id}','${i.id}')">✎</button><button class="add" onclick="addC('${i.id}')">+</button><div class="bar"><b>${esc(i.name)}</b><i>${fmt(i.price)}</i></div></div>`).join('')}</div><div class="ed"><button class="addn eb" style="display:${editing?'block':'none'}" onclick="editItem('${c.id}')">＋ إضافة أكلة إلى ${esc(c.name)}</button></div></section>`).join('')}
<button class="addn eb" style="width:100%;margin:14px 0;padding:12px;border-radius:16px;border:1px dashed var(--g);background:transparent;color:var(--g2);font:700 15px Tajawal;display:${editing?'block':'none'}" onclick="editCat()">＋ إضافة قسم جديد</button></main>
<footer><h3>تواصل بنا</h3><div class="soc"><a class="glass" href="https://www.tiktok.com/@1yyo.o?_r=1&_t=ZS-9ABxiwen3Ny" target="_blank">${TT}</a><a class="glass" href="https://www.instagram.com/1yyo.o?stkn=a3pxaTQ3cXpwcDc4" target="_blank">${IG}</a></div><div class="ph2">${['07811880898','07807344237'].map((p,k)=>`<a class="glass" href="https://wa.me/${WA[k]}" target="_blank">${WAI}${p}</a>`).join('')}</div></footer>
<button id="cartb" onclick="openCart()"></button>
<div class="ov" id="ov" onclick="if(event.target==this)this.classList.remove('on')"><div class="sheet glass" id="sh"></div></div>`;
upCart()}
function enter(){sessionStorage.in=1;$('#welcome').classList.add('hide')}
function addC(id){cart[id]=(cart[id]||0)+1;upCart()}
function find(id){for(const c of S.cats)for(const i of c.items)if(i.id==id)return i}
function upCart(){const n=Object.values(cart).reduce((a,b)=>a+b,0),b=$('#cartb');b.style.display=n?'block':'none';b.textContent=`🛒 سلة الطلب (${n}) — ${fmt(tot())} د.ع`}
function tot(){return Object.entries(cart).reduce((s,[k,v])=>s+(find(k)?.price||0)*v,0)}
function sheet(h){$('#sh').innerHTML=h;$('#ov').classList.add('on')}
function openCart(){const e=Object.entries(cart).filter(([k,v])=>v>0&&find(k));
if(!e.length){$('#ov').classList.remove('on');return}
sheet(`<h4>🛒 سلة الطلب</h4>${e.map(([k,v])=>`<div class="row"><span class="n">${esc(find(k).name)}<br><small>${fmt(find(k).price)}</small></span><span class="q"><button onclick="chg('${k}',1)">+</button>${v}<button onclick="chg('${k}',-1)">−</button></span></div>`).join('')}
<label>التوصيل</label><select id="fee" onchange="ft()">${FEES.map((f,i)=>`<option value="${f[1]}">${f[0]} — ${f[1]}</option>`).join('')}</select>
<div class="tot"><span>المجموع الكلي</span><span id="gt"></span></div>
<input id="nm" placeholder="الاسم"><input id="ph" type="tel" placeholder="رقم الهاتف"><input id="ad" placeholder="العنوان"><input id="lm" placeholder="أقرب نقطة دالة"><textarea id="nt" rows="2" placeholder="ملاحظات"></textarea>
<label>إرسال الطلب إلى</label><select id="to"><option value="0">07811880898</option><option value="1">07807344237</option></select>
<button class="big" onclick="send()">إرسال الطلب عبر واتساب</button>`);ft()}
function ft(){$('#gt').textContent=fmt(tot()+(+$('#fee').value))+' د.ع'}
function chg(k,d){cart[k]=Math.max(0,(cart[k]||0)+d);upCart();openCart()}
function send(){const g=i=>$('#'+i).value.trim();if(!g('nm')||!g('ph')||!g('ad')){msg('يرجى إدخال الاسم والهاتف والعنوان');return}
const e=Object.entries(cart).filter(([k,v])=>v>0&&find(k)),fee=+$('#fee').value;
let m=`*طلب جديد - مطعم ريماس*\n\n`+e.map(([k,v])=>`• ${find(k).name} × ${v} = ${fmt(find(k).price*v)}`).join('\n')+`\n\nالتوصيل: ${$('#fee').selectedOptions[0].text.split(' — ')[0]} (${fmt(fee)})\n*المجموع: ${fmt(tot()+fee)} د.ع*\n\nالاسم: ${g('nm')}\nالهاتف: ${g('ph')}\nالعنوان: ${g('ad')}\nأقرب نقطة دالة: ${g('lm')}\nملاحظات: ${g('nt')||'-'}`;
location.href=`https://wa.me/${WA[+$('#to').value]}?text=${encodeURIComponent(m)}`}
/* ===== edit mode ===== */
function lock(){if(editing)return;sheet('<h4>🔒 وضع التعديل</h4><input id="cd" type="password" inputmode="numeric" placeholder="أدخل الرمز"><div id="cm" style="color:#ff8a8a;min-height:22px"></div><button class="big" onclick="chk()">دخول</button>');setTimeout(()=>{const i=$('#cd');i&&(i.focus(),i.onkeydown=e=>{if(e.key==='Enter')chk()})},100)}
function chk(){if($('#cd').value.trim()===CODE){sessionStorage.edit='1';editing=true;$('#ov').classList.remove('on');render()}else $('#cm').textContent='الرمز غير صحيح'}
function msg(x){sheet('<h4>تنبيه</h4><p>'+x+'</p><button class="big" onclick="$(\'#ov\').classList.remove(\'on\')">حسناً</button>')}
function exitEd(){sessionStorage.edit='0';editing=false;render()}
function toImg(f,max=1000){return new Promise(r=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.72))};im.src=URL.createObjectURL(f)})}
let tmp;
function form(t,o,del){tmp={...o};sheet(`<h4>${t}</h4><input id="e1" placeholder="الاسم" value="${esc(o.name||'')}">${o.price!==undefined?`<input id="e2" type="number" inputmode="numeric" placeholder="السعر" value="${o.price}">`:`<input id="e3" placeholder="رمز تعبيري (مثال 🍕)" value="${esc(o.emoji||'')}">`}<div class="pv" id="pv" style="${o.img?`background-image:url(${o.img})`:''}"></div><input type="file" id="fl" accept="image/*" onchange="pick(this)"><button class="big" onclick="okf()">حفظ</button>${del?`<button class="big gl" onclick="delf()">حذف</button>`:''}`)}
async function pick(i){if(i.files[0]){tmp.img=await toImg(i.files[0]);$('#pv').style.backgroundImage=`url(${tmp.img})`}}
let ctx;
function editItem(cid,iid){const c=S.cats.find(x=>x.id==cid),i=iid&&c.items.find(x=>x.id==iid);ctx={c,i};form(i?'تعديل الأكلة':'أكلة جديدة',i||{price:0},!!i)}
function editCat(cid){const c=cid&&S.cats.find(x=>x.id==cid);ctx={c,cat:1,isNew:!c};form(c?'تعديل القسم':'قسم جديد',c?{name:c.name,emoji:c.emoji,img:c.img}:{emoji:'🍽️'},!!c)}
function okf(){const n=$('#e1').value.trim();if(!n)return;
if(ctx.cat){if(ctx.isNew)S.cats.push({id:'c'+(++seq),name:n,emoji:$('#e3').value||'🍽️',img:tmp.img||'',items:[]});else Object.assign(ctx.c,{name:n,emoji:$('#e3').value||ctx.c.emoji,img:tmp.img||''})}
else{const d={name:n,price:+$('#e2').value||0,img:tmp.img||''};ctx.i?Object.assign(ctx.i,d):ctx.c.items.push({id:'i'+(++seq),...d})}
done()}
function delf(){sheet('<h4>تأكيد الحذف؟</h4><button class="big" onclick="delOk()">نعم، احذف</button><button class="big gl" onclick="$(\'#ov\').classList.remove(\'on\')">إلغاء</button>')}
function delOk(){if(ctx.cat)S.cats=S.cats.filter(x=>x!=ctx.c);else ctx.c.items=ctx.c.items.filter(x=>x!=ctx.i);done()}
function chBg(){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=async()=>{S.bg=await toImg(i.files[0],1400);done()};i.click()}
function done(){$('#ov').classList.remove('on');render();save()}
function save(){clearTimeout(timer);const s=$('#st');if(s)s.textContent='جارٍ الحفظ...';
timer=setTimeout(async()=>{if(!pub){msg('تعذّر الحفظ للجميع: افتح الصفحة من حسابك على Claude (حساب له صلاحية التعديل) ثم عدّل.');return}
try{const c=document.documentElement.cloneNode(true);c.classList.remove('ed');c.querySelector('#app').innerHTML='';c.querySelector('#bg').removeAttribute('style');c.querySelector('#bg').className='';
c.querySelector('#state').textContent=JSON.stringify(S).replace(/</g,'\\u003c');
await pub.publish('<!DOCTYPE html>\n'+c.outerHTML)}catch(e){if(e&&e.code!=='conflict')msg('فشل الحفظ: '+(e.message||e.code))}},700)}
render();
</script>
</body></html>
