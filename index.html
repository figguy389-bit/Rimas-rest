.glass{background:var(--gl);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--bd);border-radius:26px;box-shadow:0 20px 50px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12)}
.gold{background:linear-gradient(135deg,#f6e2a3,#c99a3b 55%,#f1d78e);-webkit-background-clip:text;background-clip:text;color:transparent}
#welcome{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:18px;transition:opacity .7s,visibility .7s}
#welcome.hide{opacity:0;visibility:hidden}
.wc{max-width:460px;width:100%;padding:30px 22px;text-align:center;animation:up .9s}
@keyframes up{from{opacity:0;transform:translateY(30px)}}
.wc img{width:132px;height:132px;border-radius:50%;border:3px solid var(--g);box-shadow:0 0 40px rgba(232,199,120,.4);object-fit:cover}
.wc h1{font-size:25px;line-height:1.6;margin:14px 0 6px;font-weight:800}
.info{margin:14px 0;padding:13px;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid var(--bd);font-size:15px;line-height:1.9}
.info b{color:var(--g)}
.go{margin-top:12px;width:100%;padding:17px;font:800 19px Tajawal;color:#2a1a05;border:0;border-radius:60px;cursor:pointer;background:linear-gradient(135deg,#f6e2a3,#c99a3b);box-shadow:0 10px 30px rgba(201,154,59,.45);position:relative;overflow:hidden}
.go::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:sh 3s infinite}
@keyframes sh{to{left:130%}}
header{text-align:center;padding:26px 14px 6px}
header img{width:86px;height:86px;border-radius:50%;border:2px solid var(--g)}
header h2{font-size:24px;margin-top:6px;font-weight:800}
nav{position:sticky;top:0;z-index:20;display:flex;gap:8px;overflow-x:auto;padding:10px 12px;margin:10px 10px 0;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;display:flex;align-items:center;flex-direction:column;gap:6px;padding:9px 10px;min-width:96px;text-align:center;border-radius:22px;border:1px solid var(--bd);color:var(--tx);text-decoration:none;font-weight:700;font-size:14px;background:rgba(255,255,255,.06)}
nav a img,nav a .ph{width:76px;height:76px;font-size:36px;border-radius:18px;object-fit:cover;display:grid;place-items:center;background:rgba(232,199,120,.15)}
main{max-width:980px;margin:0 auto;padding:12px 12px 130px}
.cat{margin-top:22px;padding:16px;scroll-margin-top:90px}
.ch{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.sq{width:140px;height:140px;border-radius:26px;object-fit:cover;flex:none;border:1px solid var(--g);display:grid;place-items:center;font-size:64px;background:rgba(232,199,120,.12)}
.ch h3{font-size:28px;font-weight:800;flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.it{border-radius:22px;overflow:hidden;background:rgba(255,255,255,.07);border:1px solid var(--bd);display:flex;flex-direction:column;position:relative}
.it .sq{width:100%;height:auto;aspect-ratio:1;border-radius:0;border:0;font-size:90px}
.it .b{padding:10px 11px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.it .n{font-weight:800;font-size:18px;line-height:1.5;flex:1}
.it .p{color:var(--g);font-weight:800;font-size:17px}
.add{border:0;border-radius:14px;padding:9px;font:800 14px Tajawal;cursor:pointer;color:#2a1a05;background:linear-gradient(135deg,#f6e2a3,#c99a3b)}
.qty{display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,.35);border-radius:14px;border:1px solid var(--g)}
.qty button{width:40px;height:36px;border:0;background:none;color:var(--g);font-size:22px;font-weight:800;cursor:pointer}
.ed{display:none;gap:6px;flex-wrap:wrap}
body.edit .ed{display:flex}
.ed button,.sm{border:1px solid var(--bd);background:rgba(0,0,0,.45);color:var(--tx);border-radius:10px;padding:5px 9px;font:600 12px Tajawal;cursor:pointer}
.sm.r{border-color:#c0453a;color:#ff9b91}
footer{max-width:700px;margin:0 auto 110px;padding:24px 18px;text-align:center}
footer h3{font-size:25px;font-weight:800;margin-bottom:14px}
.soc{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.soc a{display:flex;align-items:center;gap:9px;padding:11px 18px;border-radius:50px;border:1px solid var(--bd);background:rgba(255,255,255,.08);color:var(--tx);text-decoration:none;font-weight:700;direction:ltr}
.soc svg{width:24px;height:24px}
.cartbar{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:30;max-width:560px;margin:auto;display:none;align-items:center;justify-content:space-between;padding:14px 20px;cursor:pointer;font-weight:800}
.cartbar.on{display:flex}
.fab{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;z-index:31;width:42px;height:42px;border-radius:50%;border:1px solid var(--bd);background:var(--gl);backdrop-filter:blur(10px);color:var(--g);font-size:19px;cursor:pointer}
body.edit .fab{background:var(--g);color:#000}
.mod{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center;padding:0}
.mod.on{display:flex}
.box{width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:22px 18px calc(22px + env(safe-area-inset-bottom));border-radius:26px 26px 0 0;background:rgba(24,16,10,.92)}
@media(min-width:600px){.mod{align-items:center}.box{border-radius:26px}}
.box h4{font-size:20px;margin-bottom:12px;color:var(--g)}
label{display:block;font-size:13px;margin:10px 0 4px;opacity:.85}
input,textarea{width:100%;padding:12px;border-radius:13px;border:1px solid var(--bd);background:rgba(255,255,255,.08);color:#fff;font:500 16px Tajawal}
.row{display:flex;gap:8px;margin-top:14px}.row>*{flex:1}
.ci{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.ci .sq{width:50px;height:50px;font-size:24px;border-radius:12px}
.ci .n{flex:1;font-size:14px;font-weight:600}
.ci .qty{width:104px}.ci .qty button{width:32px}
.tot{display:flex;justify-content:space-between;font-size:19px;font-weight:800;margin-top:12px;color:var(--g)}
.wa{background:linear-gradient(135deg,#46e07a,#1ea952)!important;color:#04200f!important}
.pv{width:90px;height:90px;border-radius:16px;object-fit:cover;display:block;margin:6px 0}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:99;padding:11px 22px;border-radius:40px;background:#1e8f4c;color:#fff;font-weight:700;opacity:0;pointer-events:none;transition:.3s}
#toast.on{opacity:1}

function img(o,fb){return o.img?`<img class="sq" src="${o.img}" alt="">`:`<div class="sq">${fb}</div>`}
function render(){
  $("#nav").innerHTML=data.cats.map(c=>`<a href="#${c.id}">${c.img?`<img src="${c.img}">`:`<span class="ph">${c.icon||"🍽"}</span>`}${esc(c.name)}</a>`).join("");
  $("#main").innerHTML=data.cats.map(c=>`<section class="cat glass" id="${c.id}">
  <div class="ch">${img(c,c.icon||"🍽")}<h3 class="gold">${esc(c.name)}</h3></div>
  <div class="ed" style="margin-bottom:12px"><button onclick="editCat('${c.id}')">✏ تعديل القسم</button><button onclick="editItem('${c.id}')">➕ إضافة أكلة</button></div>
  <div class="grid">${c.items.map(i=>`<div class="it">${img(i,c.icon||"🍽")}<div class="b"><div class="n">${esc(i.name)}</div><div class="p">${money(i.price)}</div>
  ${cart[i.id]?`<div class="qty"><button onclick="q('${i.id}',1)">+</button><b>${cart[i.id]}</b><button onclick="q('${i.id}',-1)">−</button></div>`:`<button class="add" onclick="q('${i.id}',1)">+ أضف للسلة</button>`}
  <div class="ed"><button onclick="editItem('${c.id}','${i.id}')">✏ تعديل</button></div></div></div>`).join("")}</div></section>`).join("");
  bar();
}
const all=()=>data.cats.flatMap(c=>c.items.map(i=>({...i,ic:c.icon})));
function q(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];render();if($("#mod").classList.contains("on")&&$("#box").dataset.m=="cart")showCart()}
function bar(){const n=Object.values(cart).reduce((a,b)=>a+b,0),t=all().reduce((s,i)=>s+(cart[i.id]||0)*i.price,0);
  $("#cbar").classList.toggle("on",n>0);$("#cn").textContent=n+" منتج";$("#ct").textContent=money(t)}
const open=(m,h)=>{$("#box").dataset.m=m;$("#box").innerHTML=h;$("#mod").classList.add("on")};
const close=()=>$("#mod").classList.remove("on");
$("#mod").onclick=e=>{if(e.target.id=="mod")close()};
function showCart(){
  const L=all().filter(i=>cart[i.id]),t=L.reduce((s,i)=>s+cart[i.id]*i.price,0);
  if(!L.length)return close();
  open("cart",`<h4>🛒 سلة الطلب</h4>${L.map(i=>`<div class="ci">${img(i,i.ic)}<div class="n">${esc(i.name)}<br><span style="color:var(--g)">${money(i.price*cart[i.id])}</span></div><div class="qty"><button onclick="q('${i.id}',1)">+</button><b>${cart[i.id]}</b><button onclick="q('${i.id}',-1)">−</button></div></div>`).join("")}
  <div class="tot"><span>المجموع</span><span>${money(t)}</span></div>
  <label>الاسم</label><input id="fn"><label>رقم الهاتف</label><input id="fp" type="tel" inputmode="tel"><label>العنوان</label><input id="fa"><label>أقرب نقطة دالة</label><input id="fl"><label>ملاحظات</label><textarea id="fo" rows="2"></textarea>
  <div class="row"><button class="add wa" onclick="send(0)">واتساب 1 📲</button><button class="add wa" onclick="send(1)">واتساب 2 📲</button></div>`);
}
function send(k){
  const v=id=>$("#"+id).value.trim();
  if(!v("fn")||!v("fp")||!v("fa")||!v("fl"))return toast("⚠ أكمل الاسم والرقم والعنوان والنقطة الدالة");
  const L=all().filter(i=>cart[i.id]),t=L.reduce((s,i)=>s+cart[i.id]*i.price,0);
  const m=`🍽 *طلب جديد - مطعم ريماس*\n\n`+L.map(i=>`• ${i.name} × ${cart[i.id]} = ${money(i.price*cart[i.id])}`).join("\n")+`\n\n💰 *المجموع:* ${money(t)}\n\n👤 الاسم: ${v("fn")}\n📞 الهاتف: ${v("fp")}\n📍 العنوان: ${v("fa")}\n🧭 أقرب نقطة دالة: ${v("fl")}`+(v("fo")?`\n📝 ملاحظات: ${v("fo")}`:"");
  window.open(`https://wa.me/${PHONES[k]}?text=${encodeURIComponent(m)}`,"_blank");
}
$("#cbar").onclick=showCart;
$("#goBtn").onclick=()=>$("#welcome").classList.add("hide");

// ===== التعديل =====
$("#fab").onclick=()=>{
  if(edit){edit=false;document.body.classList.remove("edit");return toast("تم الخروج من وضع التعديل")}
  open("pw",`<h4>🔐 وضع التعديل</h4><label>أدخل رمز الدخول</label><input id="pw" type="password" inputmode="numeric"><div class="row"><button class="add" onclick="pwOk()">دخول</button></div>`);
};
function pwOk(){if($("#pw").value.trim()===PASS){edit=true;document.body.classList.add("edit");close();toast("✓ وضع التعديل مفعّل")}else toast("⚠ الرمز غير صحيح")}
let tmp="";
function pick(){return `<input type="file" id="fi" accept="image/*" onchange="pv(this)"><img id="pvi" class="pv" style="display:${tmp?"block":"none"}" src="${tmp}">`}
function pv(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
  const s=Math.min(1,520/Math.min(im.width,im.height)),w=im.width*s,h=im.height*s,c=document.createElement("canvas");
  const z=Math.min(w,h);c.width=c.height=z;c.getContext("2d").drawImage(im,(im.width-z/s)/2,(im.height-z/s)/2,z/s,z/s,0,0,z,z);
  tmp=c.toDataURL("image/jpeg",.72);$("#pvi").src=tmp;$("#pvi").style.display="block"};im.src=r.result};r.readAsDataURL(f)}
function editCat(id){const c=data.cats.find(x=>x.id==id);tmp=c.img||"";
  open("ec",`<h4>تعديل القسم</h4><label>اسم القسم</label><input id="en" value="${esc(c.name)}"><label>الرمز (إيموجي)</label><input id="ei" value="${esc(c.icon||"")}"><label>صورة القسم (من الاستوديو)</label>${pick()}
  <div class="row"><button class="add" onclick="sc('${id}')">💾 حفظ</button><button class="sm r" onclick="dc('${id}')">حذف القسم</button></div>`)}
function sc(id){const c=data.cats.find(x=>x.id==id);c.name=$("#en").value.trim()||c.name;c.icon=$("#ei").value.trim();c.img=tmp;close();save()}
function dc(id){if(confirm("حذف القسم بكل أكلاته؟")){data.cats=data.cats.filter(x=>x.id!=id);close();save()}}
function editItem(cid,id){const c=data.cats.find(x=>x.id==cid),i=id?c.items.find(x=>x.id==id):{name:"",price:"",img:""};tmp=i.img||"";
  open("ei",`<h4>${id?"تعديل الأكلة":"إضافة أكلة جديدة"}</h4><label>الاسم</label><input id="en" value="${esc(i.name)}"><label>السعر (دينار)</label><input id="ep" type="number" inputmode="numeric" value="${i.price}"><label>الصورة (من الاستوديو)</label>${pick()}
  <div class="row"><button class="add" onclick="si('${cid}','${id||""}')">💾 حفظ</button>${id?`<button class="sm r" onclick="di('${cid}','${id}')">حذف</button>`:""}</div>`)}
function si(cid,id){const c=data.cats.find(x=>x.id==cid),n=$("#en").value.trim(),p=Number($("#ep").value);if(!n||!p)return toast("⚠ أدخل الاسم والسعر");
  if(id){const i=c.items.find(x=>x.id==id);i.name=n;i.price=p;i.img=tmp}else c.items.push({id:"i"+Date.now().toString(36),name:n,price:p,img:tmp});close();save()}
function di(cid,id){if(confirm("حذف الأكلة؟")){const c=data.cats.find(x=>x.id==cid);c.items=c.items.filter(x=>x.id!=id);delete cart[id];close();save()}}
// إضافة قسم جديد (يظهر في وضع التعديل)
const nb=document.createElement("button");nb.className="add";nb.style.cssText="margin:18px auto 0;display:none;padding:12px 26px";nb.textContent="➕ إضافة قسم جديد";
nb.onclick=()=>{data.cats.push({id:"c"+Date.now().toString(36),name:"قسم جديد",icon:"🍽",img:"",items:[]});save()};
$("#main").after(nb);
new MutationObserver(()=>nb.style.display=document.body.classList.contains("edit")?"block":"none").observe(document.body,{attributes:true});

load().then(render);render();
if(DB_URL)setInterval(async()=>{if(edit||$("#mod").classList.contains("on"))return;await load();render()},20000);
</script></body></html>
